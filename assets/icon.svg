<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sharp drop shadow (retro 3D depth) -->
  <rect x="34" y="34" width="196" height="202" rx="6" fill="#18181b"/>
  <!-- Main crisp sheet body -->
  <rect x="24" y="24" width="196" height="202" rx="6" fill="#f8fafc" stroke="#18181b" stroke-width="10"/>
  <!-- Classic Win98 Navy-to-Teal sharp header bar -->
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000080"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="29" y="29" width="186" height="46" fill="url(#hdr)"/>
  <!-- Sharp architectural binding notches -->
  <rect x="52" y="12" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#18181b" stroke-width="6"/>
  <rect x="96" y="12" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#18181b" stroke-width="6"/>
  <rect x="140" y="12" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#18181b" stroke-width="6"/>
  <rect x="184" y="12" width="16" height="28" rx="2" fill="#e2e8f0" stroke="#18181b" stroke-width="6"/>
  <!-- Highlight accent stripe (yellow marker) -->
  <rect x="48" y="100" width="96" height="16" fill="#fde047"/>
  <!-- Crisp text / code lines -->
  <rect x="48" y="104" width="88" height="8" fill="#09090b"/>
  <rect x="48" y="132" width="144" height="8" fill="#334155"/>
  <rect x="48" y="156" width="112" height="8" fill="#334155"/>
  <!-- Modern sharp slash/math badge in bottom-right corner -->
  <rect x="144" y="168" width="54" height="40" rx="2" fill="#18181b"/>
  <path d="M161 178 L153 198 M170 179 H187 L177 188 L187 197 H170" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
